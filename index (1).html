<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip runbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#EDF1EE;--surface:#FFFFFF;--ink:#1D2A2E;--muted:#5A6A6D;--line:#C9D3CF;
  --accent:#0E6E62;--accent-ink:#FFFFFF;--gap:#B4441A;--soft:#DDE7E3;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11191B;--surface:#192326;--ink:#E3ECEA;--muted:#93A4A3;--line:#2D3C3F;
    --accent:#4FB7A6;--accent-ink:#0A1412;--gap:#F08A5D;--soft:#203030;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11191B;--surface:#192326;--ink:#E3ECEA;--muted:#93A4A3;--line:#2D3C3F;
  --accent:#4FB7A6;--accent-ink:#0A1412;--gap:#F08A5D;--soft:#203030;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;padding:.75rem 1.25rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-stretch:75%;font-weight:800;font-size:1.25rem;letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-stretch:100%;font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0}
.top select{min-width:12rem;max-width:100%;padding:.45rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.45rem .8rem;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.save-state{font-size:.8rem;color:var(--muted);min-width:7rem;text-align:right}

.layout{display:grid;grid-template-columns:17rem minmax(0,1fr);gap:0;max-width:78rem;margin:0 auto}
nav.route{padding:1.5rem 1rem 2rem 1.25rem;position:sticky;top:4rem;align-self:start;max-height:calc(100vh - 4rem);overflow:auto}
.route ol{list-style:none;margin:0;padding:0;position:relative}
.route ol::before{content:"";position:absolute;left:.6rem;top:.9rem;bottom:.9rem;width:2px;background:var(--line)}
.route li{position:relative}
.route button{display:grid;grid-template-columns:1.25rem 1fr;gap:.7rem;align-items:start;width:100%;text-align:left;
  border:0;background:transparent;padding:.55rem .4rem .55rem 0;cursor:pointer;border-radius:6px}
.stop{width:1.25rem;height:1.25rem;border-radius:50%;border:2px solid var(--line);background:var(--bg);margin-top:.1rem;position:relative;z-index:1}
.route li.done .stop{background:var(--accent);border-color:var(--accent)}
.route li.part .stop{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,var(--bg) 50%)}
.route li.current .stop{box-shadow:0 0 0 4px var(--soft)}
.route .lbl{font-weight:600;line-height:1.25}
.route .when{display:block;font-weight:400;font-size:.78rem;color:var(--muted)}
.route li.current .lbl{color:var(--accent)}

main{padding:1.75rem 1.5rem 4rem;min-width:0}
.step-head{max-width:46rem}
.step-num{font-stretch:75%;font-weight:700;color:var(--muted);font-size:1rem}
h1{font-stretch:75%;font-weight:800;font-size:clamp(2rem,4vw,2.9rem);line-height:1.02;letter-spacing:-.015em;margin:.1rem 0 .6rem}
.lead{color:var(--muted);margin:0 0 1.5rem;max-width:42rem}
section.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.25rem;margin:0 0 1rem;max-width:56rem}
section.block h2{font-size:1.05rem;font-weight:700;margin:0 0 .75rem}
.note{background:var(--soft);border-color:transparent}
.note p,.note ul{margin:.25rem 0}
.note ul{padding-left:1.1rem}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.85rem 1rem}
.f{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--muted)}
.f.wide{grid-column:1/-1}
.cityfield .chips{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;padding:.3rem .4rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);position:relative;cursor:text}
.cityfield .chips:focus-within{border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--soft);color:var(--ink);border-radius:999px;padding:.15rem .25rem .15rem .65rem;font-size:.88rem}
.chip small{color:var(--muted)}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:1rem;line-height:1;padding:0 .25rem}
.chip button:hover{color:var(--gap)}
.cityfield .chips input{flex:1 1 9rem;min-width:9rem;border:0;background:transparent;padding:.3rem;font-size:.95rem;color:var(--ink)}
.cityfield .chips input:focus{outline:none}
.citylist{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;list-style:none;margin:0;padding:.25rem;z-index:15;max-height:16rem;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.citylist li{padding:.4rem .6rem;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:1rem;color:var(--ink);font-size:.92rem}
.citylist li small{color:var(--muted)}
.citylist li.on,.citylist li:hover{background:var(--soft)}
.cityhint{font-size:.82rem;color:var(--muted)}
ul.countries{margin:.25rem 0 0;padding-left:1.1rem}
input[type=text],input[type=date],input[type=url],select,textarea{width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:.95rem}
textarea{min-height:4.5rem;resize:vertical}

ul.checks{list-style:none;margin:0;padding:0}
ul.checks li+li{border-top:1px solid var(--line)}
ul.checks label{display:grid;grid-template-columns:1.4rem 1fr;gap:.6rem;padding:.55rem 0;cursor:pointer;align-items:start}
ul.checks input{width:1.15rem;height:1.15rem;margin:.15rem 0 0;accent-color:var(--accent)}
ul.checks input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}

.tbl-wrap{overflow-x:auto}
table.ed{border-collapse:collapse;width:100%;min-width:40rem;font-size:.88rem}
table.ed th{text-align:left;font-weight:600;color:var(--muted);padding:.3rem .35rem;border-bottom:1px solid var(--line);white-space:nowrap}
table.ed td{padding:.25rem .2rem;vertical-align:top}
table.ed input,table.ed select{font-size:.88rem;padding:.35rem .45rem}
table.ed td.x{width:2rem}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:.35rem}
.del:hover{color:var(--gap)}
.add{margin-top:.6rem}
tr.is-gap select{border-color:var(--gap);color:var(--gap);font-weight:600}

.gapline{font-weight:600}
.gapline.bad{color:var(--gap)}
.gapline.ok{color:var(--accent)}
pre.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.9rem;font-family:var(--font);font-size:.92rem;margin:0 0 .75rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.status{font-size:.85rem;color:var(--muted)}
.nav-foot{display:flex;justify-content:space-between;gap:1rem;max-width:56rem;margin-top:1.5rem}

.brief-wrap{overflow-x:auto;background:var(--bg);border-radius:8px;padding:1rem;border:1px solid var(--line)}
#brief{width:794px;background:#fff;color:#1D2A2E;padding:40px 44px;font-family:var(--font);font-size:11.5px;line-height:1.4;margin:0 auto}
#brief h1{font-size:26px;margin:0 0 2px;color:#1D2A2E}
#brief .sub{color:#5A6A6D;margin:0 0 14px}
#brief h2{font-size:13px;margin:16px 0 6px;padding-bottom:3px;border-bottom:2px solid #0E6E62;color:#0E6E62}
#brief table{border-collapse:collapse;width:100%}
#brief th,#brief td{border:1px solid #C9D3CF;padding:4px 6px;text-align:left;vertical-align:top}
#brief th{background:#EDF1EE;font-weight:600}
#brief ul{margin:4px 0;padding-left:16px}
#brief .blank{color:#B4441A}
#brief p{margin:3px 0}

.empty{max-width:34rem;padding:3rem 0}
.toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.route{position:static;max-height:none;padding:.75rem 1rem 0;overflow-x:auto}
  .route ol{display:flex;gap:.25rem}
  .route ol::before{left:.9rem;right:.9rem;top:1.15rem;bottom:auto;width:auto;height:2px}
  .route li{flex:0 0 auto}
  .route button{grid-template-columns:1fr;justify-items:center;text-align:center;padding:.5rem .35rem;width:5.2rem}
  .route .lbl{font-size:.75rem}
  .route .when{display:none}
  main{padding:1.25rem 1rem 3rem}
  .save-state{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Trip runbook<small>Jaya’s travel, door to door</small></div>
  <select id="tripSelect" aria-label="Choose a trip"></select>
  <button class="btn" id="newTrip">New trip</button>
  <button class="btn quiet" id="delTrip">Delete trip</button>
  <button class="btn quiet" id="backup">Back up</button>
  <button class="btn quiet" id="restoreBtn">Restore</button>
  <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  <span class="save-state" id="saveState" aria-live="polite"></span>
</header>
<div class="layout">
  <nav class="route" aria-label="Steps"><ol id="rail"></ol></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- step definitions ---------- */
const PROFILE_NOTE = `<p>From Jaya’s travel profile:</p><ul>
<li>Sydney to Hong Kong and Asia: Cathay premium economy on Asia Miles; business on points if available (check first).</li>
<li>Europe and long haul: Qatar business or first on Avios. Singapore: Singapore Airlines on KrisFlyer.</li>
<li>Domestic China and short hops: economy, the cheapest at the requested time. Bali: Jetstar or Batik, front-row window.</li>
<li>No cash for business or first unless Jaya says so. Premium economy by day; a red-eye only in business.</li>
<li>Seats: business alone window; premium economy aisle; with partner E/F in business.</li>
<li>China trains: second class unless Jaya asks for first (still to confirm). Hong Kong to Shenzhen: ask train or car.</li>
<li>Hong Kong hotels: The 99 Bonham or The Jervois suites. Leisure: Booking.com, boutique, double with balcony.</li></ul>`;

const STEPS = [
 {id:'intake', title:'Intake', when:'Same day it’s mentioned',
  lead:'Get the basics down and ask Jaya for anything missing.',
  blocks:[
   {type:'fields', title:'Trip', fields:[
     {k:'tripName',label:'Trip name',ph:'e.g. Shenzhen suppliers, Nov 2026'},
     {k:'destination',label:'Destination(s)',type:'cities',wide:true},
     {k:'dateOut',label:'Leaves',type:'date'},
     {k:'dateBack',label:'Back',type:'date'},
     {k:'kind',label:'Work or personal',type:'select',options:['Work','Personal'],rerender:true},
     {k:'china',label:'China or another WeChat country?',type:'select',options:['No','Yes'],rerender:true},
     {k:'purpose',label:'Purpose (one line)',wide:true},
     {k:'days',label:'Purpose of each day (meetings, factory visits, events)',type:'textarea',wide:true},
     {k:'meeting',label:'Who he’s meeting, and who needs to know he’s coming',type:'textarea',wide:true},
     {k:'fixedTimes',label:'Fixed times and flexible times',type:'textarea'},
     {k:'unusual',label:'Budget limits or anything unusual (samples, cash, companions)',type:'textarea'},
     {k:'selfSorted',label:'Legs Jaya will sort himself',type:'textarea',wide:true}]},
   {type:'table', title:'Travellers', key:'travellers', cols:[
     {k:'name',label:'Name'},{k:'mobile',label:'Mobile'},{k:'chat',label:'WhatsApp / WeChat'},{k:'email',label:'Email'},{k:'flights',label:'Flights'},{k:'room',label:'Room'}]},
   {type:'note', html:'<p>Passport details for every traveller go in 1Password only, never here.</p>'},
   {type:'checks', title:'Done', items:['Work or personal noted','Every traveller’s mobile and email noted','Where, when and the purpose of each day','Who he’s meeting and who needs to know','Fixed and flexible times','Budget limits or anything unusual','Legs Jaya will sort himself written down']},
   {type:'checks', title:'China', showIf:'china', items:['David Zheng told the dates today']}
 ]},
 {id:'research', title:'Research', when:'Before any options',
  lead:'Check every item against the profile. If the profile doesn’t answer it, it goes on the booking check as a question.',
  blocks:[
   {type:'countries'},
   {type:'note', html:PROFILE_NOTE},
   {type:'fields', title:'Entry, insurance and money', fields:[
     {k:'entryRoute',label:'Entry route (visa or visa-free, length of stay)',wide:true},
     {k:'entryLink',label:'Official site checked (link)',type:'url'},
     {k:'entryDate',label:'Date checked',type:'date'},
     {k:'insPolicy',label:'Travel insurance policy'},
     {k:'insLine',label:'Insurer’s 24-hour emergency line'},
     {k:'phone',label:'Phone: roaming or eSIM'},
     {k:'cards',label:'Cards'},
     {k:'localPay',label:'Local payments (e.g. Alipay, WeChat Pay)'},
     {k:'cash',label:'Cash'}]},
   {type:'checks', title:'Checked against the profile', items:[
     'Airline and cabin match the profile (points first, no cash for business or first)',
     'Timing fits: premium economy by day, red-eye only in business, morning after an overnight arrival kept free',
     'Seats match the profile',
     'Train class from the profile, or asked',
     'Hotel default for the city, or event hotel before the group-rate deadline',
     'Arrival after 10pm or before 7am: car with a sign to pre-book',
     'Entry rules checked on the official site today, for every country and every traveller’s passport',
     'Passport valid 6+ months past return for every traveller',
     'Travel insurance in place']}
 ]},
 {id:'legs', title:'Door to door', when:'Before the booking check',
  lead:'Every leg from leaving home to getting home. Each one is booked, confirmed by a named person, or marked as Jaya sorting it.',
  blocks:[
   {type:'gaps'},
   {type:'table', title:'Legs', key:'legs', cols:[
     {k:'day',label:'Day'},{k:'local',label:'Local time'},{k:'syd',label:'Sydney time'},{k:'what',label:'What'},{k:'where',label:'Where'},
     {k:'who',label:'Who'},{k:'by',label:'Booked or confirmed by'},{k:'ref',label:'Booking ref'},
     {k:'status',label:'Status',type:'select',options:['Gap','Booked','Confirmed','Jaya sorting']}]},
   {type:'checks', title:'Done', items:['Every leg booked, confirmed by a named person, or marked as Jaya sorting it','Any gap raised with Jaya before he leaves']}
 ]},
 {id:'check', title:'Booking check', when:'Wait for “yes”',
  lead:'Fill in the options and copy the message to Jaya. Nothing is paid until he replies “yes”. Silence is not a yes.',
  blocks:[
   {type:'fields', title:'Options', fields:[
     {k:'replyBy',label:'Reply by'},
     {k:'bcFlightA',label:'Flight out, option A (recommended): airline, flight, local times, cabin, seat, price, refundable y/n',type:'textarea',wide:true},
     {k:'bcFlightB',label:'Flight out, option B',type:'textarea',wide:true},
     {k:'bcReturn',label:'Return flight (changeable fare)',type:'textarea',wide:true},
     {k:'bcTrain',label:'Train: route, class, time, price',wide:true},
     {k:'bcTrainProfile',label:'Profile says (class)'},
     {k:'bcHotel',label:'Hotel: name, nights, room type, price, cancellation deadline',type:'textarea',wide:true},
     {k:'bcOther',label:'Not in the profile, please decide',type:'textarea',wide:true}]},
   {type:'bookingcheck'},
   {type:'fields', title:'Jaya’s reply', fields:[{k:'yesLink',label:'Link or screenshot location of his written “yes”',wide:true}]},
   {type:'checks', title:'Done', items:[
     'Return included, on a changeable fare','New hotel: room link or photos included',
     'Flagged: dates and times, cabin or class, anything non-refundable, anything not in the profile, anything over A$500',
     'Sent in Slack DM (WhatsApp if he’s travelling)','No reply and a fare about to expire: messaged again, then called',
     'Jaya’s written “yes” received and saved with the booking']}
 ]},
 {id:'book', title:'Book and record', when:'After the “yes”',
  lead:'Book exactly what was approved. These details feed the trip brief.',
  blocks:[
   {type:'fields', title:'Flights', fields:[
     {k:'outFlight',label:'Flight out (airline, number)'},{k:'outDay',label:'Day and date out'},
     {k:'outDep',label:'Departs (local)'},{k:'outArr',label:'Arrives (local)'},{k:'outSyd',label:'Arrives (Sydney time)'},
     {k:'backFlight',label:'Flight back (airline, number)'},{k:'backDay',label:'Day and date back'},
     {k:'backDep',label:'Departs (local)'},{k:'backArr',label:'Arrives (Sydney time)'}]},
   {type:'table', title:'Hotels', key:'hotels', cols:[
     {k:'name',label:'Hotel'},{k:'nights',label:'Nights'},{k:'addrEn',label:'Address (English)'},{k:'addrLocal',label:'Address (local script)'},
     {k:'desk',label:'Front desk'},{k:'ref',label:'Ref'},{k:'cancel',label:'Cancel by'}]},
   {type:'checks', title:'Work trip', showIf:'work', items:['Paid on the OPEX card, booked in the admin@ Trip.com account']},
   {type:'checks', title:'Personal trip', showIf:'personal', items:['Paid on Jaya’s personal card, never the OPEX card','Booked in his personal account, never admin@']},
   {type:'checks', title:'Done', items:[
     'Name on every ticket exactly as on the passport, middle name included','Return booked with the outbound, changeable fare',
     'Travelling together: one booking, seats side by side','Companions sent their own tickets and hotel details',
     'Lounge access for every flight','In-flight Wi-Fi bought',
     'Every booking in Jaya’s calendar in local time, with confirmation, address and cancellation deadline',
     'All PDFs (tickets, hotel, entry, insurance) in the trip folder',
     'Hotel paid and confirmation with Jaya 48 hours before check-in',
     'Checked in online when it opened, seats picked, boarding pass sent']}
 ]},
 {id:'people', title:'Coordinate people', when:'3 working days before',
  lead:'Everyone he’s meeting knows the plan before he lands. Stay in touch with David, or whoever he’s with, the whole way.',
  blocks:[
   {type:'table', title:'Who meets him and who to call', key:'contacts', cols:[
     {k:'person',label:'Person'},{k:'role',label:'Role'},{k:'when',label:'When and where'},{k:'phone',label:'Phone / WeChat / WhatsApp'}]},
   {type:'checks', title:'Done', items:[
     'Every local contact told the dates and plan','Confirmed who meets Jaya, where and when',
     'Pick-ups confirmed with the driver, with a phone number for each side',
     'Jaya and companions have each other’s, the drivers’ and the hosts’ numbers',
     'Taxi address cards in the local language for every hotel and meeting']}, 
   {type:'checks', title:'Team', showIf:'work', items:['Team (Ross, managers) told he’s away and when he’s reachable']},
   {type:'checks', title:'Personal trip privacy', showIf:'personal', items:['Team told only that he’s away and when he’s reachable, never where','Nothing about the trip posted in a team channel']},
   {type:'fields', title:'WeChat trip group', showIf:'china', fields:[{k:'wechatGroup',label:'Group name'},{k:'davidItin',label:'Date David’s itinerary arrived',type:'date'}]},
   {type:'checks', title:'China', showIf:'china', items:[
     'David’s full itinerary (cities, hotels, drivers, times) received 5 working days before',
     'Not there 7 days out: Jaya told',
     'Hotel name and address from David in writing, if he’s arranging it',
     'One trip group made: you, David, each host’s driver or assistant',
     'Posted: flight numbers, arrival times, hotel addresses in Chinese, who picks Jaya up',
     'Logistics only: no prices, orders, payments or terms; not in suppliers’ commercial groups',
     'Online arrival card done before arrival']}
 ]},
 {id:'emergency', title:'Emergency plan', when:'Before departure',
  lead:'One person per city who can reach Jaya in person. Keep a copy you can open without internet.',
  blocks:[
   {type:'table', title:'By city', key:'cities', cols:[
     {k:'city',label:'City'},{k:'contact',label:'Emergency contact (can reach him in person)'},{k:'phone',label:'Phone / WeChat / WhatsApp'},{k:'desk',label:'Hotel front desk'}]},
   {type:'fields', title:'Other contacts', fields:[
     {k:'consulate',label:'Australian embassy or consulate (name, phone, address)',type:'textarea',wide:true},
     {k:'smartraveller',label:'Smartraveller page',type:'url'},
     {k:'auContact',label:'Jaya’s emergency contact in Australia'}]},
   {type:'checks', title:'Done', items:['Contact for every city he stays in','Hotel desk number and local-language address for each night','Consulate noted','Smartraveller alerts subscribed','Insurance policy and 24-hour line noted (Research step)','Offline copy saved']},
   {type:'note', html:'<p>If Jaya goes quiet (check-in missed by 2 hours, or a missed flight, pick-up or meeting): call his mobile (a normal call), then WhatsApp and WeChat, then the city contact, then the hotel. After 6 hours, his contact in Australia, then the consulate. Log each step below.</p>'},
   {type:'table', title:'Contact log', key:'quietLog', cols:[{k:'time',label:'Time'},{k:'step',label:'What you did'},{k:'result',label:'Result'}]}
 ]},
 {id:'brief', title:'Trip brief', when:'48 hours before',
  lead:'Built from everything you’ve entered. Red text marks something still blank. Download it, send it to Jaya and anyone with him, and print a copy for his bag.',
  blocks:[
   {type:'fields', title:'Return plan', fields:[
     {k:'retTransfer',label:'Transfer to the airport (who, when)'},
     {k:'retBefore',label:'Before he leaves (sign, collect, ship)'},
     {k:'retWork',label:'Back at work: first commitment and time'},
     {k:'checkinTime',label:'Daily check-in time (his local morning)'}]},

function cityNorm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9\u3400-\u9fff]/g,'')}
function findCity(s){const n=cityNorm(s);return n?CITY_DATA.find(c=>c.keys.includes(n)):null}
function destList(t=cur){return (t.f.destination||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean)}
function routeCountries(){return [...new Set(destList().map(x=>findCity(x)?.country).filter(Boolean))]}
function unlistedCities(){return destList().filter(x=>!findCity(x))}
function cityHint(){
  const cs=routeCountries(), un=unlistedCities();
  if(!cs.length&&!un.length)return 'Type to search. Press Enter or a comma to add a city that isn’t in the list.';
  let h=cs.length?`Countries on the route: ${esc(cs.join(', '))}.`:'';
  if(un.length)h+=` Not in the city list, kept as typed: ${esc(un.join(', '))}.`;
  return h;
}
function cityFieldHTML(f){
  const items=destList();
  const chips=items.map((x,i)=>{const c=findCity(x);return `<span class="chip">${esc(c?c.name:x)}${c?` <small>${esc(c.country)}</small>`:''}<button type="button" data-rmcity="${i}" aria-label="Remove ${esc(c?c.name:x)}">×</button></span>`}).join('');
  return `<div class="f wide cityfield"><label for="cityInput">${esc(f.label)}</label><div class="chips">${chips}<input id="cityInput" type="text" autocomplete="off" spellcheck="false" placeholder="${items.length?'Add another city':'Type a city, e.g. Shenzhen'}" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cityList"><ul class="citylist" id="cityList" role="listbox" hidden></ul></div><div class="cityhint" id="cityHint">${cityHint()}</div></div>`;
}
let cityHi=0, cityMatches=[];
function showCityList(q){
  const ul=$('#cityList'), inp=$('#cityInput'); if(!ul)return;
  const n=cityNorm(q); if(!n){ul.hidden=true;inp.setAttribute('aria-expanded','false');return}
  const have=new Set(destList().map(x=>cityNorm(findCity(x)?.name||x)));
  const starts=[],has=[];
  for(const c of CITY_DATA){ if(have.has(cityNorm(c.name)))continue;
    if(c.keys.some(k=>k.startsWith(n)))starts.push(c);
    else if(c.keys.some(k=>k.includes(n))||cityNorm(c.country).startsWith(n))has.push(c); }
  cityMatches=[...starts,...has].slice(0,8); cityHi=0;
  const exact=cityMatches.some(c=>c.keys.includes(n));
  ul.innerHTML=cityMatches.map((c,i)=>`<li role="option" id="co${i}" data-pick="${i}" class="${i===0?'on':''}">${esc(c.name)}<small>${esc(c.country)}</small></li>`).join('')
    +(exact?'':`<li role="option" id="cofree" data-free="1" class="${cityMatches.length?'':'on'}">Add “${esc(q.trim())}”<small>as typed</small></li>`);
  ul.hidden=false; inp.setAttribute('aria-expanded','true');
}
function addCities(names,rest=''){
  const arr=destList();
  names.forEach(nm=>{const c=findCity(nm); const v=(c?c.name:String(nm)).trim(); if(v&&!arr.some(x=>cityNorm(findCity(x)?.name||x)===cityNorm(v)))arr.push(v)});
  cur.f.destination=arr.join(', '); afterDestChange(rest);
}
function afterDestChange(rest=''){
  cur.f.destination=destList().map(x=>findCity(x)?.name||x).join(', ');
  if(routeCountries().includes('China')&&cur.f.china!=='Yes'){cur.f.china='Yes';toast('Mainland China is on the route, so the China and WeChat checks are on')}
  queueSave(); renderStep(); refreshDerived();
  const inp=$('#cityInput'); if(inp){inp.value=rest; inp.focus(); if(rest)showCityList(rest)}
}

let saveTimer=null;
function queueSave(){
  if(!cur)return; cur.updated=Date.now(); setSave('Saving…');
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>persist(cur),700);
}
async function persist(trip){
  lsSave();
  if(db&&uid){
    try{await db.collection('data/users/'+uid).doc(trip.id).set(JSON.parse(JSON.stringify(trip))); setSave('Saved')}
    catch(e){setSave('Saved on this device')}
  } else setSave('Saved on this device');
}
async function removeTrip(trip){
  trips=trips.filter(t=>t.id!==trip.id); lsSave();
  if(db&&uid){try{await db.collection('data/users/'+uid).doc(trip.id).delete()}catch(e){}}
}

/* ---------- visibility + progress ---------- */
function shows(b,t=cur){
  if(!b.showIf)return true;
  if(b.showIf==='china')return t.f.china==='Yes';
  if(b.showIf==='personal')return t.f.kind==='Personal';
  if(b.showIf==='work')return t.f.kind!=='Personal';
  return true;
}
function stepProgress(si,t=cur){
  let total=0,done=0;
  STEPS[si].blocks.forEach((b,bi)=>{ if(b.type!=='checks'||!shows(b,t))return;
    b.items.forEach((_,ii)=>{total++; if(t.c[`${STEPS[si].id}.${bi}.${ii}`])done++;});});
  return {total,done};
}
function tripName(t){return t.f.tripName||t.f.destination||'Untitled trip'}

function fieldHTML(f){

function tableHTML(b){

     return `<td>${c.type==='select'?`<select ${a}>${c.options.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`:`<input type="text" ${a} value="${esc(v)}">`}</td>`;
   }).join('')}<td class="x"><button class="del" data-del="${b.key}:${ri}" aria-label="Remove row ${ri+1}">×</button></td></tr>`).join('');

function bookingMessage(){
  const f=cur.f; const names=(cur.t.travellers||[]).map(t=>t.name).filter(Boolean).join(', ');
  const L=[`BOOKING CHECK: ${f.tripName||'[trip name]'}, reply by ${f.replyBy||'[time]'}`,
    `Travellers: ${names||'[names]'}. Work or personal: ${(f.kind||'Work').toLowerCase()}`];
  if(f.bcFlightA||f.bcFlightB)L.push(`Flight out: Option A (recommended) ${f.bcFlightA||'[...]'}.`+(f.bcFlightB?` Option B ${f.bcFlightB}`:''));
  if(f.bcReturn)L.push(`Return: ${f.bcReturn}`);
  if(f.bcTrain)L.push(`Train: ${f.bcTrain}.`+(f.bcTrainProfile?` Profile says ${f.bcTrainProfile}; I've used that.`:''));
  if(f.bcHotel)L.push(`Hotel: ${f.bcHotel}`);
  if(f.bcOther)L.push(`Not in the profile, please decide: ${f.bcOther}`);
  L.push('Reply A or B, or tell me what to change.');

  <li>Out: ${B(f.outDay)}, ${B(f.outFlight)}, ${B(f.outDep)} → ${B(f.outArr)} (${B(f.outSyd)} Sydney)</li>
  <li>Back: ${B(f.backDay)}, ${B(f.backFlight)}, ${B(f.backDep)} → ${B(f.backArr)} Sydney</li>
  <li>Staying: ${hotels.length?hotels.map(h=>`${esc(h.name)}${h.nights?`, ${esc(h.nights)} nights`:''}${h.addrEn?`, ${esc(h.addrEn)}`:''}${h.addrLocal?` / ${esc(h.addrLocal)}`:''}`).join('; '):'<span class="blank">[hotel]</span>'}</li></ul>
  <h2>Door to door, day by day</h2>
  <table><tr><th>Day</th><th>Local</th><th>Sydney</th><th>What</th><th>Where</th><th>Who</th><th>Booked or confirmed by</th><th>Ref</th></tr>
  ${(t.legs||[]).map(l=>`<tr><td>${esc(l.day)}</td><td>${esc(l.local)}</td><td>${esc(l.syd)}</td><td>${esc(l.what)}</td><td>${esc(l.where)}</td><td>${esc(l.who)}</td><td>${l.status==='Gap'?'<span class="blank">Not yet covered</span>':l.status==='Jaya sorting'?'You (sorting it yourself)':esc(l.by)}</td><td>${esc(l.ref)}</td></tr>`).join('')}</table>
  <h2>Who meets you and who to call</h2>
  <table><tr><th>Person</th><th>Role</th><th>When and where</th><th>Phone / WeChat / WhatsApp</th></tr>${contacts.map(c=>`<tr><td>${esc(c.person)}</td><td>${esc(c.role)}</td><td>${esc(c.when)}</td><td>${esc(c.phone)}</td></tr>`).join('')}
  <tr><td>Anj Tino</td><td>EA</td><td>Daily check-in${ckIn}</td><td></td></tr></table>
  <h2>Emergency plan</h2>
  <table><tr><th>City</th><th>Emergency contact (can reach you in person)</th><th>Phone / WeChat / WhatsApp</th><th>Hotel front desk</th></tr>${rowsOf(t.cities||[],['city','contact','phone','desk'])}</table>
  <ul><li>Australian embassy or consulate: ${B(f.consulate)}</li>
  <li>Travel insurance: ${B(f.insPolicy)} · 24-hour emergency line: ${B(f.insLine)}</li>
  <li>Your emergency contact in Australia: ${B(f.auContact)}</li>
  <li>If you go quiet (missed check-in by 2 hours, or a missed flight or pick-up): I call your mobile, then WhatsApp and WeChat, then the city contact, then the hotel. After 6 hours, your contact in Australia, then the consulate.</li>
  ${f.china==='Yes'?`<li>WeChat trip group for arrivals: ${B(f.wechatGroup)} (you, David, the hosts’ logistics contacts)</li>`:''}</ul>
  <h2>Documents and money</h2>
  <ul><li>Passport valid 6+ months past return</li>
  <li>Entry: ${B(f.entryRoute)}, checked on ${B(f.entryLink)} on ${B(f.entryDate)}</li>
  <li>Tickets, hotel and insurance PDFs in the trip folder</li>
  <li>Cards: ${B(f.cards)}; local payments: ${B(f.localPay)}; cash: ${B(f.cash)}</li>
  <li>Phone: ${B(f.phone)}${f.china==='Yes'?'. In mainland China, Google, Gmail, WhatsApp and Slack need roaming data or a plan that works there':''}</li></ul>
  <h2>Return plan</h2>
  <ul><li>Transfer to the airport: ${B(f.retTransfer)}</li><li>Before you leave: ${B(f.retBefore)}</li><li>Back at work: ${B(f.retWork)}</li></ul>
  ${decisions.length?`<h2>Open decisions (need your answer)</h2><table><tr><th>Decision</th><th>Options</th><th>Recommendation</th><th>Needed by</th></tr>${rowsOf(decisions,['decision','options','rec','by'])}</table>`:''}`;
}
async function downloadPdf(){
  const st=$('#pdfStatus'); const el=$('#brief');
  if(!window.jspdf||!window.html2canvas){st.textContent='The PDF tools didn’t load. Reload the page and try again.';return}
  st.textContent='Building the PDF…';
  try{
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'pt',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const pxPerPage=Math.floor(canvas.width*ph/pw);
    for(let y=0,page=0;y<canvas.height;y+=pxPerPage,page++){
      const h=Math.min(pxPerPage,canvas.height-y);
      const c=document.createElement('canvas'); c.width=canvas.width; c.height=h;
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,h); ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(page)pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,pw,h*pw/canvas.width);
    }
    const name=('Trip brief - '+tripName(cur)).replace(/[\\/:*?"<>|]+/g,'-')+'.pdf';
    if(downloads) await downloads.save({filename:name,data:pdf.output('blob')});
    else pdf.save(name);
    st.textContent='Downloaded.';
  }catch(e){
    st.textContent = e&&e.code==='declined'?'Download cancelled.':e&&e.code==='rate_limited'?'A download prompt is already open.':'The PDF couldn’t be made. Try again.';
  }
}

/* ---------- events ---------- */
document.addEventListener('input',e=>{
  const el=e.target; if(!cur)return;
  if(el.id==='cityInput'){
    if(/[,;]/.test(el.value)){const parts=el.value.split(/[,;]/); const rest=parts.pop(); addCities(parts.filter(p=>p.trim()),rest.trimStart()); return}
    showCityList(el.value); return}
  if(el.dataset.f!==undefined){cur.f[el.dataset.f]=el.value; queueSave(); if(el.dataset.rr){renderStep();renderRail()} else refreshDerived(); return}
  if(el.dataset.t!==undefined){const row=cur.t[el.dataset.t][+el.dataset.r]; row[el.dataset.c]=el.value;
    if(el.dataset.c==='status'){el.closest('tr').classList.toggle('is-gap',el.value==='Gap')}
    queueSave(); refreshDerived(); return}
  if(el.dataset.check!==undefined){if(el.checked)cur.c[el.dataset.check]=true; else delete cur.c[el.dataset.check]; queueSave(); renderRail()}
});
document.addEventListener('keydown',e=>{
  if(e.target.id!=='cityInput')return;
  const ul=$('#cityList'); const items=ul&&!ul.hidden?[...ul.children]:[];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ if(!items.length)return; e.preventDefault();
    cityHi=(cityHi+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
    items.forEach((li,i)=>li.classList.toggle('on',i===cityHi)); e.target.setAttribute('aria-activedescendant',items[cityHi].id); items[cityHi].scrollIntoView({block:'nearest'}); }
  else if(e.key==='Enter'){ e.preventDefault(); const v=e.target.value.trim(); if(!v)return; const li=items[cityHi];
    addCities([li&&li.dataset.pick!==undefined?cityMatches[+li.dataset.pick].name:v]); }
  else if(e.key==='Escape'){ if(ul)ul.hidden=true; e.target.setAttribute('aria-expanded','false'); }
  else if(e.key==='Backspace'&&!e.target.value){ const arr=destList(); if(arr.length){arr.pop(); cur.f.destination=arr.join(', '); afterDestChange()} }
});
document.addEventListener('change',e=>{ if(e.target.matches('select[data-f],select[data-t]'))e.target.dispatchEvent(new Event('input',{bubbles:true})) });
document.addEventListener('click',async e=>{
  if(!e.target.closest('.cityfield')){const ul=$('#cityList'); if(ul&&!ul.hidden){ul.hidden=true;$('#cityInput').setAttribute('aria-expanded','false')}}
  const pick=e.target.closest('[data-pick]'); if(pick){addCities([cityMatches[+pick.dataset.pick].name]);return}
  if(e.target.closest('[data-free]')){addCities([$('#cityInput').value]);return}
  const rm=e.target.closest('[data-rmcity]'); if(rm){const arr=destList(); arr.splice(+rm.dataset.rmcity,1); cur.f.destination=arr.join(', '); afterDestChange(); return}
  if(e.target.classList.contains('chips')){$('#cityInput').focus();return}
  const go=e.target.closest('[data-go]');
  if(go&&cur){const i=+go.dataset.go; if(i>=0&&i<STEPS.length){cur.step=i;queueSave();renderRail();renderStep();window.scrollTo({top:0})} return}
  const add=e.target.closest('[data-add]');
  if(add){const key=add.dataset.add; const blk=STEPS.flatMap(s=>s.blocks).find(b=>b.key===key);
    const row={}; blk.cols.forEach(c=>row[c.k]=c.type==='select'?c.options[0]:''); cur.t[key].push(row); queueSave(); renderStep(); refreshDerived(); return}
  const del=e.target.closest('[data-del]');
  if(del){const [key,ri]=del.dataset.del.split(':'); cur.t[key].splice(+ri,1); queueSave(); renderStep(); refreshDerived(); return}
  if(e.target.id==='copyMsg'){try{await navigator.clipboard.writeText(bookingMessage());toast('Message copied')}catch(_){
      const r=document.createRange(); r.selectNodeContents($('#bcMsg')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Press Ctrl+C or Cmd+C to copy')} return}
  if(e.target.id==='dlPdf'){downloadPdf();return}
  if(e.target.id==='startTrip'){startNew();return}
});
function startNew(){const t=newTrip(); trips.push(t); cur=t; persist(t); renderAll(); const n=document.querySelector('[data-f="tripName"]'); if(n)n.focus()}
$('#newTrip').addEventListener('click',startNew);
$('#tripSelect').addEventListener('change',e=>{cur=trips.find(t=>t.id===e.target.value)||null;renderAll()});
$('#delTrip').addEventListener('click',async()=>{
  if(!cur)return; if(!confirm(`Delete “${tripName(cur)}”? This can’t be undone.`))return;
  await removeTrip(cur); cur=trips.slice().sort((a,b)=>b.updated-a.updated)[0]||null; renderAll(); toast('Trip deleted');
});

/* ---------- backup / restore ---------- */
$('#backup').addEventListener('click',async()=>{
  if(!trips.length){toast('No trips to back up yet');return}
  const blob=new Blob([JSON.stringify({app:'trip-runbook',version:1,saved:new Date().toISOString(),trips},null,2)],{type:'application/json'});
  const fname='trip-runbook-backup-'+new Date().toISOString().slice(0,10)+'.json';
  if(downloads){
    try{await downloads.save({filename:fname,data:blob}); toast('Backup downloaded')}
    catch(e){toast(e&&e.code==='declined'?'Backup cancelled':'The backup couldn’t be saved. Try again.')}
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=fname;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Backup downloaded');
});
$('#restoreBtn').addEventListener('click',()=>$('#restoreFile').click());
$('#restoreFile').addEventListener('change',async e=>{
  const file=e.target.files[0]; e.target.value=''; if(!file)return;
  try{
    const data=JSON.parse(await file.text()); const incoming=Array.isArray(data)?data:data.trips;
    if(!Array.isArray(incoming))throw 0;
    const byId=new Map(trips.map(t=>[t.id,t]));
    let added=0; incoming.forEach(t=>{ if(t&&t.id&&t.f&&t.t){ const l=byId.get(t.id); if(!l||t.updated>l.updated){byId.set(t.id,t);added++} } });
    trips=[...byId.values()]; lsSave(); for(const t of trips)if(db&&uid)await persist(t);
    cur=cur?trips.find(t=>t.id===cur.id):trips[0]||null; renderAll();
    toast(added?`Restored ${added} trip${added>1?'s':''}`:'Nothing new in that backup');
  }catch(_){toast('That file isn’t a trip runbook backup')}
});

/* ---------- boot ---------- */
trips=lsLoad(); cur=trips.slice().sort((a,b)=>b.updated-a.updated)[0]||null; renderAll();
setSave(trips.length?'Saved on this device':'');
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [dbNs,userNs,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
    downloads=dl;
    if(dbNs&&userNs){ uid=await userNs.id(); if(uid){ db=dbNs;
      const snap=await db.collection('data/users/'+uid).get();
      const remote=snap.docs.map(d=>d.data()).filter(Boolean).map(d=>JSON.parse(JSON.stringify(d)));
      const byId=new Map(trips.map(t=>[t.id,t]));
      remote.forEach(r=>{const l=byId.get(r.id); if(!l||r.updated>=l.updated)byId.set(r.id,r)});
      const merged=[...byId.values()];
      // push local-only or newer local trips up
      for(const t of merged){const r=remote.find(x=>x.id===t.id); if(!r||t.updated>r.updated){try{await db.collection('data/users/'+uid).doc(t.id).set(JSON.parse(JSON.stringify(t)))}catch(_){}}}
      const keepId=cur&&cur.id; trips=merged; lsSave();
      cur=trips.find(t=>t.id===keepId)||trips.slice().sort((a,b)=>b.updated-a.updated)[0]||null;
      renderAll(); setSave(trips.length?'Saved':'');
    }}
  }catch(e){ /* stays on device storage */ }
})();
</script>
