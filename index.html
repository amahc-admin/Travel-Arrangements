<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip runbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#EDF1EE;--surface:#FFFFFF;--ink:#1D2A2E;--muted:#5A6A6D;--line:#C9D3CF;
  --accent:#0E6E62;--accent-ink:#FFFFFF;--gap:#B4441A;--soft:#DDE7E3;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11191B;--surface:#192326;--ink:#E3ECEA;--muted:#93A4A3;--line:#2D3C3F;
    --accent:#4FB7A6;--accent-ink:#0A1412;--gap:#F08A5D;--soft:#203030;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11191B;--surface:#192326;--ink:#E3ECEA;--muted:#93A4A3;--line:#2D3C3F;
  --accent:#4FB7A6;--accent-ink:#0A1412;--gap:#F08A5D;--soft:#203030;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;padding:.75rem 1.25rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-stretch:75%;font-weight:800;font-size:1.25rem;letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-stretch:100%;font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0}
.top select{min-width:12rem;max-width:100%;padding:.45rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.45rem .8rem;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.save-state{font-size:.8rem;color:var(--muted);min-width:7rem;text-align:right}

.layout{display:grid;grid-template-columns:16rem minmax(0,1fr);gap:0;max-width:120rem;margin:0 auto}
nav.route{padding:1.5rem 1rem 2rem 1.25rem;position:sticky;top:4rem;align-self:start;max-height:calc(100vh - 4rem);overflow:auto}
.route ol{list-style:none;margin:0;padding:0;position:relative}
.route ol::before{content:"";position:absolute;left:.6rem;top:.9rem;bottom:.9rem;width:2px;background:var(--line)}
.route li{position:relative}
.route button{display:grid;grid-template-columns:1.25rem 1fr;gap:.7rem;align-items:start;width:100%;text-align:left;
  border:0;background:transparent;padding:.55rem .4rem .55rem 0;cursor:pointer;border-radius:6px}
.stop{width:1.25rem;height:1.25rem;border-radius:50%;border:2px solid var(--line);background:var(--bg);margin-top:.1rem;position:relative;z-index:1}
.route li.done .stop{background:var(--accent);border-color:var(--accent)}
.route li.part .stop{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,var(--bg) 50%)}
.route li.current .stop{box-shadow:0 0 0 4px var(--soft)}
.route .lbl{font-weight:600;line-height:1.25}
.route .when{display:block;font-weight:400;font-size:.78rem;color:var(--muted)}
.route li.current .lbl{color:var(--accent)}

main{padding:1.75rem 1.5rem 4rem;min-width:0}
.step-head{max-width:46rem}
.step-num{font-stretch:75%;font-weight:700;color:var(--muted);font-size:1rem}
h1{font-stretch:75%;font-weight:800;font-size:clamp(2rem,4vw,2.9rem);line-height:1.02;letter-spacing:-.015em;margin:.1rem 0 .6rem}
.lead{color:var(--muted);margin:0 0 1.5rem;max-width:42rem}
section.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.25rem;margin:0 0 1rem}
section.block h2{font-size:1.05rem;font-weight:700;margin:0 0 .75rem}
.note{background:var(--soft);border-color:transparent}
.note p,.note ul{margin:.25rem 0}
.note ul{padding-left:1.1rem}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.85rem 1rem}
.f{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--muted)}
.f.wide{grid-column:1/-1}
.cityfield .chips{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;padding:.3rem .4rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);position:relative;cursor:text}
.cityfield .chips:focus-within{border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--soft);color:var(--ink);border-radius:999px;padding:.15rem .25rem .15rem .65rem;font-size:.88rem}
.chip small{color:var(--muted)}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:1rem;line-height:1;padding:0 .25rem}
.chip button:hover{color:var(--gap)}
.cityfield .chips input{flex:1 1 9rem;min-width:9rem;border:0;background:transparent;padding:.3rem;font-size:.95rem;color:var(--ink)}
.cityfield .chips input:focus{outline:none}
.citylist{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;list-style:none;margin:0;padding:.25rem;z-index:15;max-height:16rem;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.citylist li{padding:.4rem .6rem;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:1rem;color:var(--ink);font-size:.92rem}
.citylist li small{color:var(--muted)}
.citylist li.on,.citylist li:hover{background:var(--soft)}
.cityhint{font-size:.82rem;color:var(--muted)}
ul.countries{margin:.25rem 0 0;padding-left:1.1rem}
.pills{display:flex;flex-wrap:wrap;gap:.4rem}
.pill{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:.35rem .85rem;cursor:pointer;font-size:.9rem}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.f .other{margin-top:.5rem}
.dayrow{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:.4rem 1rem;padding:.65rem 0;border-top:1px solid var(--line);align-items:start}
.dayrow:first-child{border-top:0;padding-top:.2rem}
.dayrow .d{font-weight:600;color:var(--ink);padding-top:.35rem}
.dayrow .daynote{margin-top:.45rem}
@media (max-width:600px){.dayrow{grid-template-columns:1fr}}
.calbar{margin-bottom:.6rem}
.cal{max-width:22rem;border:1px solid var(--line);border-radius:8px;padding:.6rem;background:var(--bg)}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;color:var(--ink)}
.calhead .btn{padding:.15rem .75rem;font-size:1.15rem}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calgrid .wd{font-size:.72rem;color:var(--muted);text-align:center;padding:.2rem 0}
.cd{aspect-ratio:1;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink);cursor:pointer;font-size:.88rem;padding:0}
.cd:hover{border-color:var(--accent)}
.cd.trip{background:var(--soft)}
.cd.today{text-decoration:underline;text-underline-offset:3px}
.cd.fx{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.cd.fl{border:2px dashed var(--accent);color:var(--accent);font-weight:700}
.calkey{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;margin:.5rem 0 0;font-size:.78rem}
.sw{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-left:.45rem}
.sw:first-child{margin-left:0}
.sw.trip{background:var(--soft);border:1px solid var(--line)}
.sw.fx{background:var(--accent)}
.sw.fl{border:2px dashed var(--accent)}
.tlist{margin-top:.75rem}
.trow{display:grid;grid-template-columns:7.5rem 5.5rem 7.5rem minmax(0,1fr) 2rem;gap:.5rem;align-items:center;padding:.4rem 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .d{font-weight:600;color:var(--ink)}
.tag{font-size:.78rem;border-radius:999px;padding:.1rem .55rem;text-align:center}
.tag.fx{background:var(--accent);color:var(--accent-ink)}
.tag.fl{border:1.5px dashed var(--accent);color:var(--accent)}
.brow{display:grid;grid-template-columns:6rem 10rem minmax(0,13rem) 2rem;gap:.5rem;align-items:center;margin-bottom:.45rem}
@media (max-width:600px){
  .trow{grid-template-columns:1fr auto}
  .trow input[type=text]{grid-column:1/-1}
  .brow{grid-template-columns:5.5rem 1fr 2rem}
  .brow select[data-bud$="|for"]{grid-column:1/3}
}
input[type=text],input[type=date],input[type=time],input[type=url],select,textarea{width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:.95rem}
textarea{min-height:4.5rem;resize:vertical}

ul.checks{list-style:none;margin:0;padding:0}
ul.checks li+li{border-top:1px solid var(--line)}
ul.checks label{display:grid;grid-template-columns:1.4rem 1fr;gap:.6rem;padding:.55rem 0;cursor:pointer;align-items:start}
ul.checks input{width:1.15rem;height:1.15rem;margin:.15rem 0 0;accent-color:var(--accent)}
ul.checks input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}

.tbl-wrap{overflow-x:auto}
table.ed{border-collapse:collapse;width:100%;min-width:40rem;font-size:.88rem;table-layout:fixed}
table.ed th{text-align:left;font-weight:600;color:var(--muted);padding:.3rem .35rem;border-bottom:1px solid var(--line);line-height:1.2;vertical-align:bottom}
table.ed td{padding:.25rem .2rem;vertical-align:top}
table.ed input,table.ed select{font-size:.88rem;padding:.35rem .45rem}
table.ed td.x{width:2rem}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:.35rem}
.del:hover{color:var(--gap)}
.add{margin-top:.6rem}
tr.is-gap select[data-c="status"],.legcard.is-gap select[data-c="status"]{border-color:var(--gap);color:var(--gap);font-weight:600}

.gapline{font-weight:600}
.gapline.bad{color:var(--gap)}
.gapline.ok{color:var(--accent)}
pre.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.9rem;font-family:var(--font);font-size:.92rem;margin:0 0 .75rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.status{font-size:.85rem;color:var(--muted)}
.nav-foot{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem}

.brief-wrap{overflow-x:auto;background:var(--bg);border-radius:8px;padding:1rem;border:1px solid var(--line)}
.briefdoc{width:794px;background:#fff;color:#1D2A2E;padding:40px 44px;font-family:var(--font);font-size:11.5px;line-height:1.4;margin:0 auto}
.briefdoc h1{font-size:26px;margin:0 0 2px;color:#1D2A2E}
.briefdoc .sub{color:#5A6A6D;margin:0 0 14px}
.briefdoc h2{font-size:13px;margin:16px 0 6px;padding-bottom:3px;border-bottom:2px solid #0E6E62;color:#0E6E62}
.briefdoc table{border-collapse:collapse;width:100%}
.briefdoc th,.briefdoc td{border:1px solid #C9D3CF;padding:4px 6px;text-align:left;vertical-align:top}
.briefdoc th{background:#EDF1EE;font-weight:600}
.briefdoc ul{margin:4px 0;padding-left:16px}
.briefdoc .blank{color:#B4441A}
.briefdoc p{margin:3px 0}

.empty{max-width:34rem;padding:3rem 0}
select.st-gap{border-color:var(--gap);color:var(--gap);font-weight:600}
table.ed td.ck{text-align:center;vertical-align:middle}
table.ed td.ck input{width:1.15rem;height:1.15rem;accent-color:var(--accent)}
table.ed td.nm{font-weight:600;vertical-align:middle;padding-left:.4rem;color:var(--ink)}
.mapcell{display:flex;gap:.3rem;align-items:center}
.mapcell input{min-width:0}
.maplink{flex:0 0 auto;text-decoration:none;padding:.3rem .45rem;border:1px solid var(--line);border-radius:6px;color:var(--accent);font-size:.78rem;font-weight:600;background:var(--bg)}
.maplink:hover{border-color:var(--accent)}
.maplink[hidden]{display:none}
.citylist li.attrib{cursor:default;font-size:.72rem;color:var(--muted);justify-content:flex-end;padding:.25rem .6rem}
.citylist li.attrib:hover{background:transparent}
.citylist li.msg{justify-content:flex-start;font-size:.85rem;white-space:normal}
.citylist li .pl{display:flex;flex-direction:column;min-width:0}
.citylist li .pl small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legcards{display:flex;flex-direction:column;gap:1rem}
.legcard{border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;background:var(--bg)}
.legcard.is-gap{border-left:4px solid var(--gap)}
.lc-top{display:grid;grid-template-columns:minmax(9rem,12rem) minmax(0,1fr) auto;gap:.75rem;align-items:end}
.lc-del{align-self:center;margin-top:1.2rem}
.lc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.85rem .75rem;margin-top:.85rem}
.lc-wide{grid-column:1/-1}
.lc-more{margin-top:1rem;padding-top:.85rem;border-top:1px dashed var(--line)}
.lc-h{font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:.4rem}
.lx-row{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr) 2rem;gap:.5rem;align-items:center;margin-bottom:.5rem}
.lf-list{display:flex;flex-wrap:wrap;gap:.4rem;margin:.25rem 0 .5rem}
.lf-chip{display:inline-flex;align-items:center;gap:.15rem;max-width:100%;border:1px solid var(--line);border-radius:999px;padding:.1rem .2rem .1rem .7rem;background:var(--surface);font-size:.88rem}
.lf-chip a{color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lf-chip a::before{content:"📎 "}
.lc-acts{gap:.25rem}
.lc-acts .btn{padding:.35rem .6rem;color:var(--accent)}
@media (max-width:600px){
  .lc-top{grid-template-columns:minmax(0,1fr) auto}
  .lc-top .lc-f:nth-child(2){grid-column:1/-1;grid-row:2}
  .lx-row{grid-template-columns:minmax(0,1fr) 2rem}
  .lx-row input[data-lx$=":v"]{grid-column:1;grid-row:2}
  .lx-row .del{grid-row:1/3;grid-column:2}
}
.pbriefs{display:flex;flex-wrap:wrap;gap:.4rem;margin:.25rem 0 .9rem}
.toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.route{position:static;max-height:none;padding:.75rem 1rem 0;overflow-x:auto}
  .route ol{display:flex;gap:.25rem}
  .route ol::before{left:.9rem;right:.9rem;top:1.15rem;bottom:auto;width:auto;height:2px}
  .route li{flex:0 0 auto}
  .route button{grid-template-columns:1fr;justify-items:center;text-align:center;padding:.5rem .35rem;width:5.2rem}
  .route .lbl{font-size:.75rem}
  .route .when{display:none}
  main{padding:1.25rem 1rem 3rem}
  .save-state{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Trip runbook<small>Jaya’s travel, door to door</small></div>
  <select id="tripSelect" aria-label="Choose a trip"></select>
  <button class="btn" id="newTrip">New trip</button>
  <button class="btn primary" id="dlTop">Download trip brief</button>
  <button class="btn quiet" id="delTrip">Delete trip</button>
  <button class="btn quiet" id="backup">Back up</button>
  <button class="btn quiet" id="restoreBtn">Restore</button>
  <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  <span class="save-state" id="saveState" aria-live="polite"></span>
</header>
<div class="layout">
  <nav class="route" aria-label="Steps"><ol id="rail"></ol></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- step definitions ---------- */
const PROFILE_NOTE = `<p>From Jaya’s travel profile:</p><ul>
<li>Sydney to Hong Kong and Asia: Cathay premium economy on Asia Miles; business on points if available (check first).</li>
<li>Europe and long haul: Qatar business or first on Avios. Singapore: Singapore Airlines on KrisFlyer.</li>
<li>Domestic China and short hops: economy, the cheapest at the requested time. Bali: Jetstar or Batik, front-row window.</li>
<li>No cash for business or first unless Jaya says so. Premium economy by day; a red-eye only in business.</li>
<li>Seats: business alone window; premium economy aisle; with partner E/F in business.</li>
<li>China trains: second class unless Jaya asks for first (still to confirm). Hong Kong to Shenzhen: ask train or car.</li>
<li>Hong Kong hotels: The 99 Bonham or The Jervois suites. Leisure: Booking.com, boutique, double with balcony.</li></ul>`;

const LEG_TYPES=['Car, home to the airport','Departure lounge','Flight out','Pick-up on arrival','Hotel','Meeting','Factory visit','Event','Driver between suppliers','Dinner','Train between cities','Flight between cities','Car between cities','Transfer to the airport','Return lounge','Flight home','Car, airport to home','Other'];
const FL_DIRS=['Out','Return','Between cities'];
const RES_TYPES=['Restaurant','Party venue','Activity','Tour','Transport','Other'];
const TEAM_COLS=[['s_out','Flight out'],['s_arr','Arrival transfer'],['s_hotel','Hotel'],['s_back','Flight home'],['s_dep','Transfer to the airport']];
const TEAM_TICKS=[['k_tix','Tickets sent'],['k_hotel','Hotel details sent'],['k_bp','Boarding pass sent'],['k_chat','In group chat']];
const STATUS4=['Gap','Booked','Confirmed','Own way'];
const STEPS = [
 {id:'intake', title:'Intake', when:'Same day it’s mentioned',
  lead:'Get the basics down and ask Jaya for anything missing.',
  blocks:[
   {type:'fields', title:'Trip', fields:[
     {k:'tripName',label:'Trip name',ph:'e.g. Shenzhen suppliers, Nov 2026'},
     {k:'destination',label:'Destination(s)',type:'cities',wide:true},
     {k:'dateOut',label:'Leaves',type:'date',days:true},
     {k:'dateBack',label:'Back',type:'date',days:true},
     {k:'kind',label:'Work or personal',type:'select',options:['Work','Personal'],rerender:true},
     {k:'team',label:'Team trip (several people)?',type:'select',options:['No','Yes'],rerender:true},
     {k:'china',label:'China or another WeChat country?',type:'select',options:['No','Yes'],rerender:true},
     {k:'purpose',label:'Purpose (choose all that apply)',type:'purpose',wide:true},
     {k:'days',label:'Purpose of each day',type:'dayplan',wide:true},
     {k:'meeting',label:'Who he’s meeting, and who needs to know he’s coming',type:'textarea',wide:true},
     {k:'fixedTimes',label:'Fixed and flexible dates',type:'times',wide:true},
     {k:'budget',label:'Budget limits',type:'budget',wide:true},
     {k:'unusual',label:'Anything unusual (samples, cash, companions)',type:'textarea',wide:true},
     {k:'selfSorted',label:'Legs Jaya will sort himself',type:'textarea',wide:true}]},
   {type:'table', title:'Travellers', key:'travellers', cols:[
     {k:'name',label:'Name',w:10},{k:'from',label:'Flying from',team:true,city:true,w:9},{k:'mobile',label:'Mobile',w:8},{k:'chat',label:'WhatsApp / WeChat',china:true,w:8},{k:'email',label:'Email',w:11},{k:'room',label:'Room',team:true,optional:true,w:7},{k:'notes',label:'Dietary or notes',optional:true,w:9}]},
   {type:'note', html:'<p>Passport details for every traveller go in 1Password only, never here.</p>'},
   {type:'checks', title:'Done', items:['Work or personal noted','Every traveller’s mobile and email noted','Where, when and the purpose of each day','Who he’s meeting and who needs to know','Fixed and flexible times','Budget limits or anything unusual','Legs Jaya will sort himself written down']},
   {type:'checks', title:'China', showIf:'china', items:['David Zheng told the dates today']}
 ]},
 {id:'research', title:'Research', when:'Before any options',
  lead:'Check every item against the profile. If the profile doesn’t answer it, it goes on the booking check as a question.',
  blocks:[
   {type:'countries'},
   {type:'note', html:PROFILE_NOTE},
   {type:'fields', title:'Entry, insurance and money', fields:[
     {k:'entryRoute',label:'Entry route (visa or visa-free, length of stay)',wide:true},
     {k:'entryLink',label:'Official site checked (link)',type:'url'},
     {k:'entryDate',label:'Date checked',type:'date'},
     {k:'insPolicy',label:'Travel insurance policy'},
     {k:'insLine',label:'Insurer’s 24-hour emergency line'},

async function downloadPdf(pi=null){
  if(pi!==null&&typeof pi==='object')pi=null;
  const stEl=$('#pdfStatus'); const st={set textContent(v){ if(stEl)stEl.textContent=v; else if(v)toast(v)}};
  if(!cur)return;
  if(!window.jspdf||!window.html2canvas){st.textContent='The PDF tools didn’t load. Reload the page and try again.';return}
  let el=pi===null?$('#brief'):null, tmp=null;
  if(!el){tmp=document.createElement('div'); tmp.style.cssText='position:fixed;left:-10000px;top:0'; tmp.innerHTML=`<div class="briefdoc"></div>`; document.body.appendChild(tmp); el=tmp.firstChild; el.innerHTML=briefHTML(pi)}
  st.textContent='Building the PDF…';
  try{
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'pt',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const pxPerPage=Math.floor(canvas.width*ph/pw);
    for(let y=0,page=0;y<canvas.height;y+=pxPerPage,page++){
      const h=Math.min(pxPerPage,canvas.height-y);
      const c=document.createElement('canvas'); c.width=canvas.width; c.height=h;
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,h); ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(page)pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,pw,h*pw/canvas.width);
    }
    const who=pi!==null?' - '+(((cur.t.travellers||[])[pi]||{}).name||'traveller'):'';
    const name=('Trip brief - '+tripName(cur)+who).replace(/[\\/:*?"<>|]+/g,'-')+'.pdf';
    if(downloads) await downloads.save({filename:name,data:pdf.output('blob')});
    else pdf.save(name);
    st.textContent='Downloaded.';
  }catch(e){
    st.textContent = e&&e.code==='declined'?'Download cancelled.':e&&e.code==='rate_limited'?'A download prompt is already open.':'The PDF couldn’t be made. Try again.';
  }finally{ if(tmp)tmp.remove(); }
}

  if(e.target.matches&&e.target.matches('input[type=date],input[type=time]')){try{e.target.showPicker()}catch(_){}}
  const ob=e.target.closest('[data-opt]'); if(ob&&cur){const k='opt_'+ob.dataset.opt; cur.f[k]=cur.f[k]==='Yes'?'No':'Yes'; queueSave(); renderStep(); return}
  if(!e.target.closest('.cityfield')){const ul=$('#cityList'); if(ul&&!ul.hidden){ul.hidden=true;$('#cityInput').setAttribute('aria-expanded','false')}}
  if(cur&&e.target.closest('[data-fasel],[data-faall],[data-facity],[data-faclear]')){const fa=cur.fa=cur.fa||{dir:'Out',sel:[]}; const b=e.target.closest('[data-fasel],[data-faall],[data-facity],[data-faclear]'); let sel=new Set(fa.sel||[]);
    if(b.dataset.fasel){sel.has(b.dataset.fasel)?sel.delete(b.dataset.fasel):sel.add(b.dataset.fasel)}
    else if(b.dataset.faall)travellerNames().forEach(n=>sel.add(n));
    else if(b.dataset.facity)(cur.t.travellers||[]).filter(r=>r.name&&r.from===b.dataset.facity).forEach(r=>sel.add(r.name));
    else sel=new Set();
    fa.sel=[...sel]; queueSave(); renderStep(); return}
  if(cur&&e.target.closest('[data-faadd]')){const fa=cur.fa||{}; const ns=fa.sel||[]; if(!ns.length)return; cur.t.flights=cur.t.flights||[];
    ns.forEach(n=>cur.t.flights.push({status:'Gap',who:n,dir:fa.dir||'Out',airline:fa.airline||'',flight:fa.flight||'',date:fa.date||'',from:fa.from||'',to:fa.to||'',dep:fa.dep||'',arr:fa.arr||'',ref:'',seat:'',bags:''}));
    const k=ns.length; cur.fa={dir:fa.dir||'Out',sel:[]}; queueSave(); renderStep(); refreshDerived(); toast(`Added ${k} flight row${k>1?'s':''}. Add each booking ref and seat.`); return}
  const lp=e.target.closest('[data-legp]'); if(lp&&cur){cur.legP=lp.dataset.legp; cur.legCopy=[]; queueSave(); renderStep(); return}
  if(cur&&e.target.closest('[data-lstart]')){const P=legPerson(); DEFAULT_LEGS.forEach(w=>cur.t.legs.push(blankLeg(w,P))); queueSave(); renderStep(); refreshDerived(); return}
  const lf=e.target.closest('[data-lfrom]'); if(lf&&cur){const P=legPerson(); legsOf(lf.dataset.lfrom).forEach(l=>cur.t.legs.push(cloneLeg(l,P))); queueSave(); renderStep(); refreshDerived(); toast(`Copied ${lf.dataset.lfrom}’s legs`); return}
  const lc=e.target.closest('[data-lcsel],[data-lcall],[data-lccity],[data-lcclear]');
  if(lc&&cur){const P=legPerson(); const others=(cur.t.travellers||[]).filter(r=>r.name&&r.name!==P); let sel=new Set(cur.legCopy||[]);
    if(lc.dataset.lcsel){sel.has(lc.dataset.lcsel)?sel.delete(lc.dataset.lcsel):sel.add(lc.dataset.lcsel)}
    else if(lc.dataset.lcall)others.forEach(r=>sel.add(r.name));
    else if(lc.dataset.lccity)others.filter(r=>r.from===lc.dataset.lccity).forEach(r=>sel.add(r.name));
    else sel=new Set();
    cur.legCopy=[...sel]; queueSave(); renderStep(); return}
  if(cur&&e.target.closest('[data-lcgo]')){const P=legPerson(); const src=legsOf(P); const tg=cur.legCopy||[]; if(!tg.length)return;
    const has=tg.filter(n=>legsOf(n).length); if(has.length&&!confirm(`${has.join(', ')} already ${has.length>1?'have':'has'} legs. Replace them with ${P}’s?`))return;
    cur.t.legs=cur.t.legs.filter(l=>!tg.includes(l.person)); tg.forEach(n=>src.forEach(l=>cur.t.legs.push(cloneLeg(l,n))));
    cur.legCopy=[]; queueSave(); renderStep(); refreshDerived(); toast(`Copied to ${tg.length} ${tg.length>1?'people':'person'}`); return}
  const pb=e.target.closest('[data-pbrief]'); if(pb&&cur){downloadPdf(+pb.dataset.pbrief); return}
  const cm=e.target.closest('[data-calmode]'); if(cm&&cur){calMode=cm.dataset.calmode; refreshTimes(`[data-calmode="${calMode}"]`); return}
  const cn=e.target.closest('[data-calnav]'); if(cn&&cur){const [y,m]=calView.split('-').map(Number); const d=new Date(Date.UTC(y,m-1+(+cn.dataset.calnav),1)); calView=d.toISOString().slice(0,7); refreshTimes(`[data-calnav="${cn.dataset.calnav}"]`); return}
  const cd=e.target.closest('[data-cal]'); if(cd&&cur){const iso=cd.dataset.cal; cur.times=cur.times||{}; const t=cur.times[iso];
    if(t&&t.kind===calMode)delete cur.times[iso]; else cur.times[iso]={kind:calMode,time:t?t.time:'',note:t?t.note:''};
    queueSave(); refreshTimes(`[data-cal="${iso}"]`); refreshDerived(); return}
  const td=e.target.closest('[data-tmdel]'); if(td&&cur){delete cur.times[td.dataset.tmdel]; queueSave(); refreshTimes(); refreshDerived(); return}
  if(e.target.closest('[data-budadd]')&&cur){const last=cur.budget[cur.budget.length-1]; cur.budget.push({c:last?last.c:'AUD',a:'',for:'Whole trip'}); queueSave(); refreshBudget(); const ins=document.querySelectorAll('[data-bud$="|a"]'); if(ins.length)ins[ins.length-1].focus(); return}
  const bd=e.target.closest('[data-buddel]'); if(bd&&cur){cur.budget.splice(+bd.dataset.buddel,1); queueSave(); refreshBudget(); return}
  const pp=e.target.closest('[data-purpose]');
  if(pp&&cur){const v=pp.dataset.purpose; const sel=purposeSel(); const i=sel.indexOf(v);
    if(i>=0)sel.splice(i,1); else sel.push(v);
    sel.sort((a,b)=>PURPOSES.indexOf(a)-PURPOSES.indexOf(b)); syncPurpose();
    queueSave(); renderStep(); refreshDerived(); if(v==='Other'&&i<0){const o=$('#purposeOther'); if(o)o.focus()} return}
  const dt=e.target.closest('[data-daytag]');
  if(dt&&cur){const [d,t]=dt.dataset.daytag.split('|'); cur.dp=cur.dp||{}; const en=(cur.dp[d]=cur.dp[d]||{tags:[],note:''}); en.tags=en.tags||[];
    const i=en.tags.indexOf(t); if(i>=0)en.tags.splice(i,1); else en.tags.push(t);
    en.tags.sort((a,b)=>DAY_TAGS.indexOf(a)-DAY_TAGS.indexOf(b));
    dt.setAttribute('aria-pressed',String(i<0)); queueSave(); refreshDerived(); return}
  const pick=e.target.closest('[data-pick]'); if(pick){addCities([cityMatches[+pick.dataset.pick].name]);return}
  if(e.target.closest('[data-free]')){addCities([$('#cityInput').value]);return}
  const rm=e.target.closest('[data-rmcity]'); if(rm){const arr=destList(); arr.splice(+rm.dataset.rmcity,1); cur.f.destination=arr.join(', '); afterDestChange(); return}
  if(e.target.classList.contains('chips')){$('#cityInput').focus();return}
  const go=e.target.closest('[data-go]');
  if(go&&cur){const i=+go.dataset.go; if(i>=0&&i<STEPS.length){cur.step=i;queueSave();renderRail();renderStep();window.scrollTo({top:0})} return}
  const add=e.target.closest('[data-add]');
  if(add){const key=add.dataset.add; const blk=STEPS.flatMap(s=>s.blocks).find(b=>b.key===key);
    const row={}; blk.cols.forEach(c=>row[c.k]=c.type==='select'?(typeof c.options==='function'?c.options():c.options)[0]:''); if(blk.perPerson&&legPerson())row.person=legPerson(); cur.t[key].push(row); queueSave(); renderStep(); refreshDerived(); return}
  const lxa=e.target.closest('[data-lxadd]'); if(lxa&&cur){const l=cur.t.legs[+lxa.dataset.lxadd]; (l.extra=l.extra||[]).push({k:'',v:''}); queueSave(); renderStep(); const ins=document.querySelectorAll(`[data-lx^="${lxa.dataset.lxadd}:${l.extra.length-1}:k"]`); if(ins[0])ins[0].focus(); return}
  const lxd=e.target.closest('[data-lxdel]'); if(lxd&&cur){const [ri,i]=lxd.dataset.lxdel.split(':'); cur.t.legs[+ri].extra.splice(+i,1); queueSave(); renderStep(); return}
  const lfd=e.target.closest('[data-lfdel]'); if(lfd&&cur){const [ri,i]=lfd.dataset.lfdel.split(':'); const l=cur.t.legs[+ri]; if(!confirm(`Remove “${l.files[+i].name}” from this leg? The file stays in Google Drive.`))return; l.files.splice(+i,1); queueSave(); renderStep(); return}
  const lfl=e.target.closest('[data-lflink]'); if(lfl&&cur){const url=(prompt('Paste a link to the file (for example a Google Drive link)')||'').trim(); if(!url)return;
    if(!/^https?:\/\//i.test(url)){toast('That doesn’t look like a link');return}
    const name=(prompt('What should this link be called?',/drive\.google|docs\.google/.test(url)?'Google Drive file':url.replace(/^https?:\/\/(www\.)?/,'').split('/')[0])||'').trim()||'Link';
    const l=cur.t.legs[+lfl.dataset.lflink]; (l.files=l.files||[]).push({name,url}); queueSave(); renderStep(); return}
  const lfa=e.target.closest('[data-lfattach]'); if(lfa&&cur){attachToLeg(cur.t.legs[+lfa.dataset.lfattach]); return}
  const del=e.target.closest('[data-del]');
  if(del){const [key,ri]=del.dataset.del.split(':'); cur.t[key].splice(+ri,1); queueSave(); renderStep(); refreshDerived(); return}
  if(e.target.id==='copyMsg'){try{await navigator.clipboard.writeText(bookingMessage());toast('Message copied')}catch(_){
      const r=document.createRange(); r.selectNodeContents($('#bcMsg')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Press Ctrl+C or Cmd+C to copy')} return}
  if(e.target.id==='dlPdf'){downloadPdf();return}
  if(e.target.id==='startTrip'){startNew();return}
});
function startNew(){const t=newTrip(); trips.push(t); cur=t; persist(t); renderAll(); const n=document.querySelector('[data-f="tripName"]'); if(n)n.focus()}
$('#newTrip').addEventListener('click',startNew);
$('#dlTop').addEventListener('click',downloadPdf);
$('#tripSelect').addEventListener('change',e=>{cur=trips.find(t=>t.id===e.target.value)||null;renderAll()});
$('#delTrip').addEventListener('click',async()=>{
  if(!cur)return; if(!confirm(`Delete “${tripName(cur)}”? This can’t be undone.`))return;
  await removeTrip(cur); cur=trips.slice().sort((a,b)=>b.updated-a.updated)[0]||null; renderAll(); toast('Trip deleted');
});

/* ---------- backup / restore ---------- */
$('#backup').addEventListener('click',async()=>{
  if(!trips.length){toast('No trips to back up yet');return}
  const blob=new Blob([JSON.stringify({app:'trip-runbook',version:1,saved:new Date().toISOString(),trips},null,2)],{type:'application/json'});
  const fname='trip-runbook-backup-'+new Date().toISOString().slice(0,10)+'.json';
  if(downloads){
    try{await downloads.save({filename:fname,data:blob}); toast('Backup downloaded')}
    catch(e){toast(e&&e.code==='declined'?'Backup cancelled':'The backup couldn’t be saved. Try again.')}
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=fname;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Backup downloaded');
});
$('#restoreBtn').addEventListener('click',()=>$('#restoreFile').click());
$('#restoreFile').addEventListener('change',async e=>{
  const file=e.target.files[0]; e.target.value=''; if(!file)return;
  try{
    const data=JSON.parse(await file.text()); const incoming=Array.isArray(data)?data:data.trips;
    if(!Array.isArray(incoming))throw 0;
    const byId=new Map(trips.map(t=>[t.id,t]));
    let added=0; incoming.forEach(t=>{ if(t&&t.id&&t.f&&t.t){ const l=byId.get(t.id); if(!l||t.updated>l.updated){byId.set(t.id,t);added++} } });
    trips=[...byId.values()]; lsSave(); for(const t of trips)if(db&&uid)await persist(t);
    cur=cur?trips.find(t=>t.id===cur.id):trips[0]||null; renderAll();
    toast(added?`Restored ${added} trip${added>1?'s':''}`:'Nothing new in that backup');
  }catch(_){toast('That file isn’t a trip runbook backup')}
});

window.addEventListener('scroll',e=>{hideCellList(); if(!(e.target&&e.target.id==='placeList'))positionPlaceList()},true);
window.addEventListener('resize',positionPlaceList);
window.addEventListener('resize',()=>hideCellList());
/* ---------- boot ---------- */
trips=lsLoad(); cur=trips.slice().sort((a,b)=>b.updated-a.updated)[0]||null; renderAll();
setSave(trips.length?'Saved on this device':'');
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [dbNs,userNs,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
    downloads=dl;
    if(dbNs&&userNs){ uid=await userNs.id(); if(uid){ db=dbNs;
      const snap=await db.collection('data/users/'+uid).get();
      const remote=snap.docs.map(d=>d.data()).filter(Boolean).map(d=>JSON.parse(JSON.stringify(d)));
      const byId=new Map(trips.map(t=>[t.id,t]));
      remote.forEach(r=>{const l=byId.get(r.id); if(!l||r.updated>=l.updated)byId.set(r.id,r)});
      const merged=[...byId.values()];
      // push local-only or newer local trips up
      for(const t of merged){const r=remote.find(x=>x.id===t.id); if(!r||t.updated>r.updated){try{await db.collection('data/users/'+uid).doc(t.id).set(JSON.parse(JSON.stringify(t)))}catch(_){}}}
      const keepId=cur&&cur.id; trips=merged; lsSave();
      cur=trips.find(t=>t.id===keepId)||trips.slice().sort((a,b)=>b.updated-a.updated)[0]||null;
      renderAll(); setSave(trips.length?'Saved':'');
    }}
  }catch(e){ /* stays on device storage */ }
})();
</script>
